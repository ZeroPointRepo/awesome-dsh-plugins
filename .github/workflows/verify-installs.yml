name: verify-installs

on:
  schedule:
    # Off the hour deliberately. :00 is the most contended slot on GitHub's scheduler and runs
    # there are silently DROPPED under load — this portfolio lost every scheduled run for a full
    # week that way (2026-08-24 -> 2026-08-31) with every workflow still reporting state:active.
    # The minute is allocated portfolio-wide in PORTFOLIO.json -> tooling.cron_minute_map.
    # Do not "tidy" this back to :00.
    - cron: '23 8 * * 1' # Mondays 08:23 UTC, ahead of the weekly maintenance pass
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/verify-installs.mjs
      - .github/scripts/build-catalog.mjs
      - .github/scripts/build-readme-sections.mjs
      - .github/scripts/refresh-stars.mjs
      - .github/scripts/snapshot-stars.mjs
      - .github/scripts/lib/markers.mjs
      - .github/workflows/verify-installs.yml

permissions:
  contents: write

# One walk at a time, per repo. Every scheduled workflow here walks the same catalog through the
# same installation-wide 5,000 REST calls/hour, so two overlapping walks drain each other
# mid-walk regardless of the budget either one started with (AK evidence, 2026-08-27). The group
# is shared by name across this repo's scheduled workflows, so the overlap is STRUCTURALLY
# impossible rather than merely unlikely. QUEUE, never cancel: a catalog walk that gets killed
# half-way publishes a partial catalog, which is the exact failure the shrink guard exists to
# catch. pr-validate is deliberately NOT in this group — contributor PRs must never queue behind
# a catalog walk.
concurrency:
  group: catalog-walk
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Re-resolve every entry against its canonical name
        # SECURITY, not hygiene. When a repository is renamed or transferred, the old path keeps
        # redirecting until somebody claims the vacated name; from that moment every link we
        # publish points at whoever took it, and nothing looks broken in the meantime because the
        # redirect returns 200 the whole time. Keyed by IMMUTABLE repository id: resolving the
        # slug follows the redirect, so once a squatter holds the old name a slug-keyed lookup
        # returns the squatter and confirms our stale link as canonical.
        # Runs FIRST so a rename found today is already fixed on the page every step below reads.
        # continue-on-error, not `if: always()` on everything downstream: a walk that could not
        # establish 95% of its facts exits non-zero on purpose, and that must show as a failed
        # step. It must not also cancel the catalog rebuild underneath it — the two read
        # different sources and a REST hiccup in one is not a reason to publish nothing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/resolve-names.mjs README.md CONTRIBUTING.md

      - name: Add the canonical-name result to the run summary
        # A silent clean run and a silent broken run look identical. The report always says how
        # many were resolved by immutable id, how many by slug, and how many were not established.
        if: always()
        run: cat canonical-names-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify every install command against its own source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-installs.mjs README.md

      - name: Refresh the star figures in README.md
        # These are hand-written and rot fast: 54 of 75 were more than 5% off after three days,
        # several by half. The counts were already being fetched by the step above and by
        # build-catalog.mjs for CATALOG.md, then thrown away for the one file people read.
        # No-op when nothing moved, so this does not manufacture weekly commits.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/refresh-stars.mjs README.md

      - name: Rebuild CATALOG.md
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_RANK_UNKNOWN_IDS: ${{ secrets.CATALOG_RANK_UNKNOWN_IDS }}
        run: node .github/scripts/build-catalog.mjs

      - name: Append a dated star snapshot to the ledger
        # Append-only, keyed by immutable repo id. Rides this walk instead of taking a cron of
        # its own: the ceiling here is one catalog walk at a time, and the numbers this needs
        # were already fetched two steps up. `if: always()` because the ledger is a record of
        # what was observed, and an upstream step finding drift is not a reason to skip
        # recording the week.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/snapshot-stars.mjs CATALOG.md .github/data/star-history.json

      - name: Refresh the generated README sections
        # Every number on the page is derived, not written: the headline count and the panorama
        # from the page's own catalog markers, the recently-added list from the first-seen
        # ledger, the resolved count from plugins.json and the coverage badge from both tiers.
        # Offline, so it costs nothing to run every time, and a no-op when nothing moved. Runs
        # last on purpose: its inputs are what the three steps above just rewrote.
        if: always()
        run: node .github/scripts/build-readme-sections.mjs README.md

      - name: Commit updated badge and catalog data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TRACKED="badges/ CATALOG.md catalog.csv plugins.json README.md .github/data/first-seen.json .github/data/star-history.json .github/data/repo-ids.json"
          if git diff --quiet -- $TRACKED; then
            echo "No badge or catalog change."
            exit 0
          fi
          git add $TRACKED
          git commit -m "chore: refresh install-verification badges and catalog [skip ci]"
          # Two runs can finish at once (the weekly cron, a push, a manual dispatch). Rebasing does
          # not work here: both runs rewrite the same generated files, so the rebase stops on a
          # content conflict in CATALOG.md every time. These files are pure output, so the loser
          # simply replays its own copy on top of whatever landed first. README.md is hand-written,
          # so only the one generated line in it is re-applied, never the whole file.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            tmp=$(mktemp -d)
            cp -r badges CATALOG.md catalog.csv plugins.json .github/data/first-seen.json .github/data/star-history.json "$tmp"/
            git reset --hard origin/main
            # The ledger is the one file that must not simply be overwritten: a first-seen date is
            # only ever wrong in the "too late" direction, so keep the earlier of the two.
            node -e '
              const fs=require("fs"), a=process.argv[1], b=process.argv[2];
              const rd=p=>{try{return JSON.parse(fs.readFileSync(p,"utf8"))}catch{return{seen:{}}}};
              const mine=rd(a), theirs=rd(b), seen={...theirs.seen};
              for(const [k,v] of Object.entries(mine.seen||{})) if(!seen[k]||v<seen[k]) seen[k]=v;
              mine.seen=Object.fromEntries(Object.entries(seen).sort(([x],[y])=>x.localeCompare(y)));
              fs.writeFileSync(b, JSON.stringify(mine,null,2)+"\n");
            ' "$tmp/first-seen.json" .github/data/first-seen.json
            # Same one-directional reasoning, one file over: a dated reading already on
            # main is kept, ours only adds dates it does not have.
            node .github/scripts/merge-star-history.mjs "$tmp/star-history.json" .github/data/star-history.json
            cp -r "$tmp"/badges "$tmp"/CATALOG.md "$tmp"/catalog.csv "$tmp"/plugins.json .
            # Every number on the page is re-derived here rather than replayed. It used to be a
            # sed keyed to one sentence's exact wording, which meant rewording the sentence
            # silently disabled the refresh on this path only. The marker regions are derived the
            # same way on any tree, and all three of this script's inputs (the README's own
            # catalog, the restored plugins.json, the restored badge) are correct at this point.
            node .github/scripts/build-readme-sections.mjs README.md
            git add $TRACKED
            git diff --cached --quiet && exit 0
            git commit -m "chore: refresh install-verification badges and catalog [skip ci]"
          done
          git push
