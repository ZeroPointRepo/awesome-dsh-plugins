name: verify-installs

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC, ahead of the weekly maintenance pass
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/verify-installs.mjs
      - .github/scripts/build-catalog.mjs
      - .github/workflows/verify-installs.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every install command against its own source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-installs.mjs README.md

      - name: Refresh the star figures in README.md
        # These are hand-written and rot fast: 54 of 75 were more than 5% off after three days,
        # several by half. The counts were already being fetched by the step above and by
        # build-catalog.mjs for CATALOG.md, then thrown away for the one file people read.
        # No-op when nothing moved, so this does not manufacture weekly commits.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/refresh-stars.mjs README.md

      - name: Rebuild CATALOG.md
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-catalog.mjs

      - name: Commit updated badge and catalog data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TRACKED="badges/ CATALOG.md catalog.csv plugins.json README.md .github/data/first-seen.json"
          if git diff --quiet -- $TRACKED; then
            echo "No badge or catalog change."
            exit 0
          fi
          git add $TRACKED
          git commit -m "chore: refresh install-verification badges and catalog [skip ci]"
          # Two runs can finish at once (the weekly cron, a push, a manual dispatch). Rebasing does
          # not work here: both runs rewrite the same generated files, so the rebase stops on a
          # content conflict in CATALOG.md every time. These files are pure output, so the loser
          # simply replays its own copy on top of whatever landed first. README.md is hand-written,
          # so only the one generated line in it is re-applied, never the whole file.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            tmp=$(mktemp -d)
            cp -r badges CATALOG.md catalog.csv plugins.json .github/data/first-seen.json "$tmp"/
            git reset --hard origin/main
            # The ledger is the one file that must not simply be overwritten: a first-seen date is
            # only ever wrong in the "too late" direction, so keep the earlier of the two.
            node -e '
              const fs=require("fs"), a=process.argv[1], b=process.argv[2];
              const rd=p=>{try{return JSON.parse(fs.readFileSync(p,"utf8"))}catch{return{seen:{}}}};
              const mine=rd(a), theirs=rd(b), seen={...theirs.seen};
              for(const [k,v] of Object.entries(mine.seen||{})) if(!seen[k]||v<seen[k]) seen[k]=v;
              mine.seen=Object.fromEntries(Object.entries(seen).sort(([x],[y])=>x.localeCompare(y)));
              fs.writeFileSync(b, JSON.stringify(mine,null,2)+"\n");
            ' "$tmp/first-seen.json" .github/data/first-seen.json
            cp -r "$tmp"/badges "$tmp"/CATALOG.md "$tmp"/catalog.csv "$tmp"/plugins.json .
            count=$(grep -c '^| \[' CATALOG.md)
            sed -i -E "s/^(- \*\*Full catalog:\*\* every verified DSH plugin \()[0-9]+(\) in .*)$/\1${count}\2/" README.md
            git add $TRACKED
            git diff --cached --quiet && exit 0
            git commit -m "chore: refresh install-verification badges and catalog [skip ci]"
          done
          git push
